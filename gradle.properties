# Project-wide Gradle settings.

# Parallel execution & build cache for faster builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Optimize daemon JVM options (4GB heap required for R8/ProGuard minification)
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX & R-class optimization
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin & Daemon tuning
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx1024m
